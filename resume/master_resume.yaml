# =============================================================================
# MASTER RESUME  —  single source of truth for the resume tailoring tool.
#
# This mirrors Martin_Shijo_Resume_v6, the general resume. The tailoring tool
# (`resume/tailor.py`) reorders and emphasizes the items below based on each
# company's job description. The richer and more accurate the `tags` on each
# item, the better the tailored output — extend them as you add experience.
#
# `tags` are lowercase keywords (skills, tools, domains) that an item
# demonstrates; they drive relevance matching against a job description.
# =============================================================================

