# Optional tailored summary. Placeholders filled per application:
#   {company} -> company you're applying to
#   {role}    -> role (falls back to "software" if not provided)
#   {skills}  -> your top strengths that matched this job description
# Set `include_summary: false` to omit the summary entirely.
include_summary: true
summary_template: >-
  Computer Science student at the University of Maryland (graduating May 2029)
  pursuing a {role} role at {company}. Hands-on builder with strengths in
  {skills}, combining self-directed software projects with real prototyping,
  robotics, and team-leadership experience.

